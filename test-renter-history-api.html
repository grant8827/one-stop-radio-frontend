<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renter History API Test</title>
</head>
<body>
    <h1>Renter History API Test</h1>
    <button onclick="testRenterHistoryAPI()">Test Renter History API</button>
    <div id="results"></div>

    <script>
        async function testRenterHistoryAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = 'Testing...';
            
            try {
                // Note: This is a simplified test - in production you'd need proper authentication
                const response = await fetch('/api/dashboard/renter-history', {
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                        // Add authorization header if needed: 'Authorization': 'Bearer TOKEN'
                    }
                });
                
                const data = await response.json();
                
                resultsDiv.innerHTML = `
                    <h2>API Response:</h2>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Success:</strong> ${data.success}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
                if (data.success && data.data) {
                    console.log('Renter History Data:', data.data);
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `
                    <h2>Error:</h2>
                    <p>${error.message}</p>
                `;
                console.error('API Test Error:', error);
            }
        }
    </script>
</body>
</html>
